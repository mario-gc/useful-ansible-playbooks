services:
  ansible:
    image: alpine/ansible:latest
    container_name: ansible-runner
    volumes:
      - ./playbooks:/home/ansible/playbooks:ro
      - ./inventory:/home/ansible/inventory:ro
      - ~/.ssh:/home/ansible/.ssh:ro
    env_file:
      - .env
    working_dir: /home/ansible
    command: >
      ansible-playbook
      ${ANSIBLE_PLAYBOOK}
      -i ${ANSIBLE_INVENTORY}
      ${ANSIBLE_EXTRA_VARS:+-e @${ANSIBLE_EXTRA_VARS}}
      --private-key /home/ansible/.ssh/${ANSIBLE_SSH_KEY}
    stdin_open: true
    tty: true
